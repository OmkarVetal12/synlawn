<template>
    <lightning-card title="Consume Inventory">

       
        <template if:true={isMobile}>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_stacked">
                <tbody>
                    <template for:each={inventoryItems} for:item="item">
                        <tr key={item.productItemId}>
                            <td data-label="Product">
                                {item.productName}
                            </td>
                            <td data-label="Location">
                                {item.locationName}
                            </td>
                            <td data-label="Quantity On Hold">
                                {item.quantityOnHold}
                            </td>
                            <td data-label="Quantity To Consume">
                                <lightning-input
                                    type="number"
                                    min="0"
                                    max={item.quantityOnHold}
                                    data-id={item.productItemId}
                                    onchange={handleQuantityChange}>
                                </lightning-input>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </template>

        <template if:false={isMobile}>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Location</th>
                        <th>Quantity On Hold</th>
                        <th>Quantity To Consume</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={inventoryItems} for:item="item">
                        <tr key={item.productItemId}>
                            <td>{item.productName}</td>
                            <td>{item.locationName}</td>
                            <td>{item.quantityOnHold}</td>
                            <td>
                                <lightning-input
                                    type="number"
                                    min="0"
                                    max={item.quantityOnHold}
                                    data-id={item.productItemId}
                                    onchange={handleQuantityChange}>
                                </lightning-input>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
              <div class="slds-p-top_small slds-text-color_error slds-text-align_center">
                    <strong>The Turf "Quantity to Consume" is in LF</strong>
            </div>
        </template>

        <div class="slds-p-around_medium slds-text-align_right">
            <lightning-button
                variant="brand"
                label="Confirm"
                class="confirm-btn"
                onclick={handleConfirm}>
            </lightning-button>
        </div>

    </lightning-card>
</template>
