<template>

    <!-- SCREEN 1 : SELECT PRODUCTS -->
    <template if:true={isSelectScreen}>
        <div class="slds-p-around_medium slds-size_1-of-1">

            <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                Select Products
            </h2>

            <div class="slds-scrollable_x">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Product Name</th>
                            <th>Family</th>
                            <th>Quote Quantity</th>
                            <th>Held Quantity</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={productList} for:item="product">
                            <tr key={product.id}>
                                <td>
                                    <lightning-input
                                        type="checkbox"
                                        data-id={product.id}
                                        onchange={handleProductSelection}>
                                    </lightning-input>
                                </td>
                                <td>{product.name}</td>
                                <td>{product.family}</td>
                                <td>{product.quantity}</td>
                                <td>{product.onHold}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- NOTE TEXT -->
            <div class="slds-p-top_small slds-text-color_error slds-text-align_center">
                <strong>The Turf "Quote Quantity" is in SQFT</strong>
            </div>

            <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button
                    variant="brand"
                    label="Next"
                    onclick={handleNext}
                    disabled={isNextDisabled}>
                </lightning-button>
            </div>

        </div>
    </template>

    <!-- SCREEN 2 : INVENTORY VALIDATION -->
    <template if:true={isInventoryScreen}>
        <div class="slds-p-around_medium slds-size_1-of-1">

            <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                Inventory
            </h2>

            <!-- Filters -->
            <div class="slds-grid slds-gutters slds-m-bottom_medium">
                <div class="slds-col">
                    <lightning-input
                        label="Filter by Product"
                        onchange={handleProductFilterChange}>
                    </lightning-input>
                </div>
                <div class="slds-col">
                    <lightning-input
                        label="Filter by Location"
                        onchange={handleLocationFilterChange}>
                    </lightning-input>
                </div>
            </div>

            <!-- Table -->
            <div class="slds-scrollable_x">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                    <thead>
                        <tr>
                            <th data-field="productName" onclick={handleSort}>
                                Product {sortSymbols.productName}
                            </th>
                            <th data-field="locationName" onclick={handleSort}>
                                Location {sortSymbols.locationName}
                            </th>
                            <th>Item Desc</th>
                            <th data-field="receivedDate" onclick={handleSort}>
                                Recd Date {sortSymbols.receivedDate}
                            </th>
                            <th data-field="serialNumber" onclick={handleSort}>
                               Roll id. {sortSymbols.serialNumber}
                            </th>
                            <th data-field="dyeLot" onclick={handleSort}>
                                Dye Lot {sortSymbols.dyeLot}
                            </th>
                            <th data-field="quality" onclick={handleSort}>
                                Quality {sortSymbols.quality}
                            </th>
                            <th data-field="availableQty" onclick={handleSort}>
                                Avl Qty {sortSymbols.availableQty}
                            </th>
                            <th data-field="quantityOnHold" onclick={handleSort}>
                                Held Qty {sortSymbols.quantityOnHold}
                            </th>
                            <th>Hold Qty</th>
                        </tr>
                    </thead>

                    <tbody>
                        <template for:each={visibleInventoryData} for:item="row">
                            <tr key={row.productItemId}>
                                <td>{row.productName}</td>
                                <td>{row.locationName}</td>
                                <td class="wrap-text">{row.itemDescription}</td>
                                <td>{row.receivedDate}</td>
                                <td>{row.serialNumber}</td>
                                <td>{row.dyeLot}</td>
                                <td>{row.quality}</td>
                                <td>{row.availableQty}</td>
                                <td>{row.quantityOnHold}</td>
                                <td>
                                    <lightning-input
                                        type="number"
                                        min="0"
                                        max={row.availableQty}
                                        data-id={row.productItemId}
                                        onchange={handleHoldQuantityChange}>
                                    </lightning-input>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
               
            </div>
            <div class="slds-p-top_small slds-text-color_error slds-text-align_center">
                  <strong>The Turf quantity you have to hold is in LF</strong>
            </div>
            <!-- Footer -->
            <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button
                    label="Back"
                    onclick={handleBack}>
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    variant="brand"
                    label="Confirm"
                    onclick={handleConfirm}>
                </lightning-button>
            </div>

        </div>
    </template>

</template>
